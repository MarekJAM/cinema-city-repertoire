name: cinema_city
description: Unofficial cinema city repertoire app.

version: 1.2.0+11

environment:
  sdk: '>=3.10.0'
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  html: ^0.15.7
  timezone: ^0.11.2
  dio: ^5.11.1
  injectable: ^3.0.0
  get_it: ^9.3.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  cupertino_icons: ^2.0.0
  flutter_local_notifications: ^23.0.1
  flutter_timezone: ^5.1.1
  hive_ce_flutter: ^2.3.4
  hive_ce: ^2.23.3
  hive_ce_generator: ^1.11.2
  injectable_generator: ^3.1.3
  rxdart: ^0.28.0
  skeletonizer: ^3.0.0
  firebase_crashlytics: ^6.0.1
  firebase_core: ^5.1.0
  cached_network_image: ^4.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  slang_build_runner: ^4.19.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
#  assets:

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/icon_macos.png"

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
